name: cargo-deny

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Every check configured in deny.toml must appear here, or a section can
        # silently stop being enforced: `[bans]` was configured but never listed
        # in the matrix, so duplicate-crate / banned-crate regressions reached
        # main unblocked (issue #656).
        checks:
          - advisories
          - bans
          - licenses
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}