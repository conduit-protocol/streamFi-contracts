name: Indexer CI

on:
  push:
    branches: [main]
    paths:
      - 'indexer/**'
      - '.github/workflows/indexer-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'indexer/**'
      - '.github/workflows/indexer-ci.yml'

jobs:
  indexer:
    name: Indexer (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: indexer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
